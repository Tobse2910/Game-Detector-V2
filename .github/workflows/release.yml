name: Release (Windows)

# Builds the plugin and attaches a ready to use ZIP to the release for the pushed tag.
# UpdateChecker asks the GitHub API for the newest release, so a tag is what makes an
# update visible to everyone who already has the plugin installed.
#
# Tagging is the only step done by hand:
#   git tag v1.1.0 && git push tobse v1.1.0
#
# workflow_dispatch runs the build alone, without publishing anything, to check that
# the build still works without spending a version number on it.

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same preset and options as a local build, so CI cannot drift away from what
      # was tested by hand. Inno Setup stays off: the fork ships the PowerShell
      # installer in dist/ instead.
      - name: Configure
        run: cmake --preset windows-x64 -DENABLE_INNO_SETUP=OFF

      - name: Build
        run: cmake --build build_x64 --config RelWithDebInfo --target GameDetector

      # The archive root holds only what a user should click: the two launchers, the
      # guide and the license. Everything technical goes into plugin\, which is where
      # Installieren.bat looks for install.ps1, and install.ps1 in turn copies
      # obs-plugins\64bit\game-detector.dll and data\obs-plugins\game-detector\*
      # from next to itself.
      - name: Assemble package
        shell: pwsh
        run: |
          $stage = "package"
          $plugin = "$stage/plugin"
          New-Item -ItemType Directory -Force -Path "$plugin/obs-plugins/64bit" | Out-Null
          New-Item -ItemType Directory -Force -Path "$plugin/data/obs-plugins/game-detector" | Out-Null

          Copy-Item "build_x64/RelWithDebInfo/game-detector.dll" "$plugin/obs-plugins/64bit/" -Force
          Copy-Item "data/*" "$plugin/data/obs-plugins/game-detector/" -Recurse -Force
          Copy-Item "dist/install.ps1", "dist/uninstall.ps1", "dist/ui.ps1" "$plugin/" -Force
          # LICENSE and FORK-CHANGES ship with the binary because GPL-2.0 asks for
          # the license text and for the changes against upstream to be marked.
          Copy-Item "INSTALL.md", "README.md", "FORK-CHANGES.md" "$plugin/" -Force
          Copy-Item "dist/Installieren.bat", "dist/Deinstallieren.bat", "dist/ANLEITUNG.txt", "LICENSE" "$stage/" -Force

          # Checked one by one, because a package that merely contains the right files
          # in the wrong places still leaves the launcher pointing at nothing.
          $required = @(
            "Installieren.bat",
            "Deinstallieren.bat",
            "ANLEITUNG.txt",
            "plugin/install.ps1",
            "plugin/uninstall.ps1",
            "plugin/ui.ps1",
            "plugin/obs-plugins/64bit/game-detector.dll",
            "plugin/data/obs-plugins/game-detector/update.ps1",
            "plugin/data/obs-plugins/game-detector/locale/de-DE.ini"
          )
          foreach ($path in $required) {
            if (-not (Test-Path (Join-Path $stage $path))) { throw "missing from the package: $path" }
          }

          # The launchers hardcode plugin\, so verify the path they actually call.
          foreach ($launcher in @("Installieren.bat", "Deinstallieren.bat")) {
            $text = Get-Content (Join-Path $stage $launcher) -Raw
            foreach ($match in [regex]::Matches($text, '%~dp0([^"'']+)')) {
              $called = Join-Path $stage $match.Groups[1].Value
              if (-not (Test-Path $called)) { throw "$launcher calls a path that is not in the package: $($match.Groups[1].Value)" }
            }
          }

          $name = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME } else { "dev" }
          Compress-Archive -Path "$stage/*" -DestinationPath "Game-Detector-V2-$name.zip" -Force
          Get-ChildItem "Game-Detector-V2-$name.zip" | Select-Object Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-detector-plugin
          path: Game-Detector-V2-*.zip

      - name: Release notes from commits
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const currentTag = process.env.GITHUB_REF_NAME;

            const tags = await github.rest.repos.listTags({ owner, repo });
            const previousTag = tags.data.length > 1 ? tags.data[1].name : null;

            let commitsText = "";

            if (previousTag) {
              const compare = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: previousTag,
                head: currentTag
              });

              commitsText = compare.data.commits
                .map(c => `- ${c.commit.message.split("\n")[0]}`)
                .join("\n");
            } else {
              commitsText = "First release of this fork.";
            }

            const note = [
              "### Installation",
              "",
              "1. ZIP herunterladen und entpacken",
              "2. OBS Studio komplett schliessen",
              "3. `Installieren.bat` als Administrator starten",
              "",
              "Details stehen in `ANLEITUNG.txt` im ZIP.",
              "",
              "### Aenderungen",
              "",
              commitsText
            ].join("\n");

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `body<<EOF\n${note}\nEOF\n`);

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Game Detector V2 ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
          files: Game-Detector-V2-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
