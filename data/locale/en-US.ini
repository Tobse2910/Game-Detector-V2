SmartContext.Announce="Announce switches in chat"
SmartContext.Announce.Tooltip="Posts an additional message in your chat after every category switch. Placeholders: {game} for the category, {title} for the stream title."
SmartContext.Announce.Message="Chat message:"
SmartContext.Announce.Placeholder="e.g.: Category changed to {game}"
SmartContext.ManageRules="Manage Smart Context Rules"
SmartContext.ManageRules.Tooltip="Map applications to Twitch categories, stream titles and per-rule delays."
SmartContext.Rules.WindowTitle="Game Detector - Smart Context Rules"
SmartContext.Rules.GroupTitle="Smart Context Rules"
SmartContext.Rules.Hint="Rules are matched against the executable of the foreground window. The process name may contain * and ? wildcards. When several rules match, the highest priority wins; on a tie an exact name beats a wildcard. Ignored applications never change the category. Leave the delay on 'Default' to use the delay configured in the dock. Title placeholders: {game}, {app}, {window}, {server}, {title}. {server} is the FiveM server name, {title} your own title. So \"{server} | {title}\" puts the server in front of your title without losing any of it. Without a server, {server} drops out together with its separator."
