IgnoredApps.WindowTitle="Game Detector - Ignored Applications"
IgnoredApps.Hint="These applications never change the category. While one of them is in the foreground nothing happens at all: the current category stays, and a running countdown is neither continued nor reset. The wildcards * and ? are allowed, e.g. *WaveLink*.exe"
