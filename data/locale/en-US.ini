# Smart Context Mode
SmartContext.GroupTitle="Smart Context"
SmartContext.Enable="Smart Context Mode"
SmartContext.Enable.Tooltip="Detects which application you are actually using (foreground window) and switches the category once that application has been in front for the configured time."
SmartContext.Lock="Lock category"
SmartContext.Lock.Tooltip="While locked, no automatic category change is performed at all."
SmartContext.Fallback="Fixed category when nothing is recognised"
SmartContext.Fallback.Tooltip="When nothing is recognised, neither a rule nor a game from the list, this category is set after the configured delay. The stream title falls back to your own, so a server name in front of it drops out. Ignored applications stay neutral, which is what the ignore list is for: a quick look at Discord should not move the category. Anyone who installed before 1.6.2 still has the Windows desktop (explorer.exe) on the ignore list and therefore sees 'Ignored (category stays)' on an empty screen. Remove it once under Ignored applications and the fixed category applies there too."
SmartContext.Fallback.CategoryLabel="Category:"
SmartContext.Fallback.Category.Tooltip="Free text. The name has to match the one on Twitch exactly, otherwise Twitch rejects the change."
SmartContext.DelayLabel="Switch delay:"
SmartContext.Delay.Default="Default"
SmartContext.Delay.30s="30 seconds"
SmartContext.Delay.1m="1 minute"
SmartContext.Delay.2m="2 minutes"
SmartContext.Delay.5m="5 minutes"
